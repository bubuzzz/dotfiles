[general]
import = [
  "~/.config/alacritty/themes/kanagawa-dragon.toml",
  "~/.config/alacritty/keybinding.toml",
]

[terminal.shell]
program = "/bin/bash"
args = ["-l", "-c", "tmux attach -t main || tmux new -s main"]

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window.dimensions]
columns = 130
lines = 40

[window.padding]
x = 5

