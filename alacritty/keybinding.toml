[[keyboard.bindings]]
key="Back"
mods= "Control"
chars="\u0017"

# Alt+Number -> send Esc+Number (Meta-number) so tmux sees M-<num>
[[keyboard.bindings]]
key = "Key0"
mods = "Super"
chars = "\u001b0"

