[project]
name = "reader"
version = "0.1.0"
description = "Turn a web page into clean Markdown for reading in the terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "requests>=2.34.2",
]

[project.scripts]
reader = "reader.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
