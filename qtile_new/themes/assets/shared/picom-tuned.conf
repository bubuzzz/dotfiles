# Tuned compositor settings, forked from picom-cozytile.conf: square flush bar,
# no animations, no fading, smaller corner radius and a stronger shadow.
# Shared by the themes that use the tuned bar; symlinked from each of them.
# Fork a copy into a theme's own directory if it needs to diverge.
# Shadows + corner-radius + blur are what let this theme separate windows;
# they are the reason upstream can run border_width = 0.
# Loaded by scripts/picom-reload for whichever theme symlinks it.

#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 20;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-opacity = 0.7;

#################################
#           Fading              #
#################################
fading = false;

#################################
#         Corner Radius         #
#################################
corner-radius = 4;

#################################
#        Background Blur        #
#################################
blur: {
  method = "dual_kawase";
  strength = 6;
};
blur-background = true;
blur-background-frame = true;

#################################
#             Rules             #
#################################
rules: (
  {
    match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    opacity = 0.90;
  },
  {
    match = "fullscreen || window_type = 'dock'";
    corner-radius = 0;
    blur-background = false;
  },
  {
    # The qtile bar carries no WM_CLASS and no _NET_WM_WINDOW_TYPE -- only a
    # QTILE_INTERNAL property -- so a class_g match never reaches it.
    # It sits flush against the screen edges here, so rounding its corners
    # would notch the screen corners.  Opacity is set on the Bar in qtile.
    match = "QTILE_INTERNAL@ = 1";
    corner-radius = 0;
    # NB: only `shadow = true/false` is honoured per-rule in picom 13.
    # shadow-opacity / -radius / -offset are parsed here but silently ignored,
    # so the strength below is set globally instead.
    # Shadow left on: with shadow-offset = -shadow-radius the shadow is centred
    # on the window, so a bar flush to the top edge still casts one downward.
  },
  {
    match = "class_g = 'Joplin'";
    opacity = 0.9;
  },
  {
    match = "class_g = 'st'";
    opacity = 0.7;
  },
  {
    match = "class_g = 'slop'";
    opacity = 1.0;
    shadow = false;
    fade = false;
    blur-background = false;
  }
);
